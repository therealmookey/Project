<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 20px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        .status-dot.inactive {
            background: #999;
            animation: none;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .status-text {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin: 10px 0;
        }
        .info-text {
            font-size: 12px;
            color: #999;
            text-align: center;
        }
        .driver-input {
            margin: 15px 0;
        }
        .driver-input label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .driver-input input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .driver-input input:focus {
            outline: none;
            border-color: #2196F3;
        }
        .driver-input input:disabled {
            background: #f5f5f5;
            color: #999;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        .btn-row button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }
        .btn-start {
            background: #2196F3;
        }
        .btn-start:hover {
            background: #1976D2;
        }
        .btn-start:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .btn-stop {
            background: #f44336;
        }
        .btn-stop:hover {
            background: #d32f2f;
        }
        .btn-stop:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .btn-save {
            background: #4CAF50;
        }
        .btn-save:hover {
            background: #388E3C;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        .persistent-badge {
            display: inline-block;
            background: #4CAF50;
            color: white;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 8px;
        }
        .saved-driver {
            background: #f0f7fa;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #2c7da0;
            margin-top: 10px;
            display: none;
            align-items: center;
            justify-content: space-between;
        }
        .saved-driver .clear-btn {
            background: none;
            border: none;
            color: #f44336;
            cursor: pointer;
            font-size: 16px;
            padding: 0 5px;
        }
        .saved-driver .clear-btn:hover {
            color: #d32f2f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 Tracker</h1>
        <p class="subtitle">Deel jouw locatie in real-time</p>

        <!-- Chauffeur ID input -->
        <div class="driver-input">
            <label for="driverId">🔑 Chauffeur ID:</label>
            <input type="text" id="driverId" placeholder="Bijv. chauffeur-001, tablet-01, etc." value="">
        </div>

        <!-- Opgeslagen chauffeur (bij permanente sessie) -->
        <div class="saved-driver" id="savedDriver">
            <span>💾 Huidige chauffeur: <strong id="savedDriverName"></strong></span>
            <button class="clear-btn" id="clearSavedDriver" title="Verwijder opgeslagen chauffeur">✖</button>
        </div>

        <div class="btn-row">
            <button id="startBtn" class="btn-start">📍 Start</button>
            <button id="stopBtn" class="btn-stop" style="display:none;">⏹ Stop</button>
        </div>

        <div id="status" class="status-text">
            <span class="status-dot inactive" id="statusDot"></span>
            <span id="statusText">Klaar</span>
        </div>
        <div id="coords" class="info-text">Wacht op locatie...</div>
        <div class="stats">
            <span id="updateCount">📤 Updates: 0</span>
            <span id="sessionInfo">⏸️ Gestopt</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================================
        // CONFIGURATIE
        // ============================================================
        const SUPABASE_URL = 'https://jcdqcgviossmrvlgsiqd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_BhTGDyLsGeHEMConkTeqcg_LHK5pLoG';
        const TABLE_NAME = 'locations_test';
        const COMMAND_TABLE = 'tracker_commands';
        const FALLBACK_LAT = 51.0;
        const FALLBACK_LNG = 4.0;
        const STORAGE_KEY = 'tracker_driver_id';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============================================================
        // STATE
        // ============================================================
        let watchId = null;
        let isTracking = false;
        let lastLocation = null;
        let intervalId = null;
        let updateCount = 0;
        let driverId = '';

        // ============================================================
        // DOM ELEMENTEN
        // ============================================================
        const driverIdInput = document.getElementById('driverId');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const coordsEl = document.getElementById('coords');
        const updateCountEl = document.getElementById('updateCount');
        const sessionInfoEl = document.getElementById('sessionInfo');
        const savedDriverEl = document.getElementById('savedDriver');
        const savedDriverName = document.getElementById('savedDriverName');
        const clearSavedDriverBtn = document.getElementById('clearSavedDriver');

        // ============================================================
        // FUNCTIES
        // ============================================================
        function updateStatus(active, message) {
            if (active) {
                statusDot.className = 'status-dot';
                statusText.textContent = message || 'Actief';
                sessionInfoEl.textContent = '🟢 Actief';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';
                driverIdInput.disabled = true;
            } else {
                statusDot.className = 'status-dot inactive';
                statusText.textContent = message || 'Gestopt';
                sessionInfoEl.textContent = '⏸️ Gestopt';
                startBtn.style.display = 'block';
                stopBtn.style.display = 'none';
                driverIdInput.disabled = false;
            }
        }

        function updateUI(latitude, longitude, accuracy) {
            coordsEl.innerHTML = `
                📍 ${latitude.toFixed(6)}, ${longitude.toFixed(6)}<br>
                🎯 Nauwkeurigheid: ${(accuracy || 0).toFixed(0)}m
            `;
            updateCountEl.textContent = `📤 Updates: ${updateCount}`;
        }

        async function getIPLocation() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                if (data.latitude && data.longitude) {
                    return { latitude: data.latitude, longitude: data.longitude };
                }
                return null;
            } catch (err) {
                console.warn('⚠️ IP locatie mislukt:', err.message);
                return null;
            }
        }

        async function sendLocation(lat, lng) {
            if (!driverId) {
                console.warn('⚠️ Geen driver ID');
                return false;
            }

            try {
                const { data: existing, error: checkError } = await supabaseClient
                    .from(TABLE_NAME)
                    .select('driver_id')
                    .eq('driver_id', driverId)
                    .maybeSingle();

                if (checkError) {
                    console.warn('⚠️ Check error:', checkError.message);
                    return false;
                }

                let result;
                if (existing) {
                    result = await supabaseClient
                        .from(TABLE_NAME)
                        .update({
                            latitude: lat,
                            longitude: lng,
                            last_updated: new Date().toISOString()
                        })
                        .eq('driver_id', driverId);
                } else {
                    result = await supabaseClient
                        .from(TABLE_NAME)
                        .insert({
                            driver_id: driverId,
                            driver_name: `Chauffeur ${driverId}`,
                            latitude: lat,
                            longitude: lng,
                            last_updated: new Date().toISOString()
                        });
                }

                if (result.error) {
                    console.warn('⚠️ Send error:', result.error.message);
                    return false;
                }
                return true;
            } catch (err) {
                console.warn('⚠️ Send exception:', err.message);
                return false;
            }
        }

        function startTracking() {
            if (isTracking) return;

            driverId = driverIdInput.value.trim();
            if (!driverId) {
                alert('⚠️ Vul een chauffeur ID in!');
                return;
            }

            // Sla driver ID op voor permanente sessie
            localStorage.setItem(STORAGE_KEY, driverId);
            showSavedDriver(driverId);

            console.log(`📍 Tracking gestart voor: ${driverId}`);
            isTracking = true;
            updateCount = 0;
            updateStatus(true, `Actief - ${driverId}`);

            // GPS starten
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(
                    async (position) => {
                        const { latitude, longitude, accuracy } = position.coords;
                        lastLocation = { latitude, longitude, timestamp: Date.now() };
                        updateCount++;
                        await sendLocation(latitude, longitude);
                        updateUI(latitude, longitude, accuracy);
                        console.log(`📍 GPS update #${updateCount} - ${driverId}`);
                    },
                    async (error) => {
                        console.warn('⚠️ GPS error:', error.message);
                        if (error.code === 3) {
                            console.log('📍 Gebruik fallback locatie');
                            const ipLocation = await getIPLocation();
                            if (ipLocation) {
                                await sendLocation(ipLocation.latitude, ipLocation.longitude);
                                lastLocation = { ...ipLocation, timestamp: Date.now() };
                                updateCount++;
                                updateUI(ipLocation.latitude, ipLocation.longitude, 5000);
                            } else {
                                await sendLocation(FALLBACK_LAT, FALLBACK_LNG);
                                lastLocation = { latitude: FALLBACK_LAT, longitude: FALLBACK_LNG, timestamp: Date.now() };
                                updateCount++;
                                updateUI(FALLBACK_LAT, FALLBACK_LNG, 5000);
                            }
                        }
                    },
                    {
                        enableHighAccuracy: false,
                        timeout: 30000,
                        maximumAge: 60000
                    }
                );
            } else {
                console.warn('⚠️ Geolocatie niet beschikbaar, gebruik fallback');
                sendLocation(FALLBACK_LAT, FALLBACK_LNG);
                lastLocation = { latitude: FALLBACK_LAT, longitude: FALLBACK_LNG, timestamp: Date.now() };
                updateCount++;
                updateUI(FALLBACK_LAT, FALLBACK_LNG, 5000);
            }

            // Heartbeat
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(async () => {
                if (!isTracking) return;
                if (lastLocation) {
                    const { latitude, longitude } = lastLocation;
                    await sendLocation(latitude, longitude);
                    console.log(`💓 Heartbeat - ${driverId}`);
                }
            }, 5000);
        }

        function stopTracking() {
            if (!isTracking) return;
            
            console.log(`📍 Tracking gestopt voor: ${driverId}`);
            isTracking = false;
            updateStatus(false, 'Gestopt');
            coordsEl.textContent = 'Wacht op locatie...';

            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }

            // Verwijder locatie uit database
            supabaseClient
                .from(TABLE_NAME)
                .delete()
                .eq('driver_id', driverId)
                .then(() => console.log(`🗑️ Locatie verwijderd voor: ${driverId}`))
                .catch(() => {});
        }

        // ============================================================
        // OPGESLAGEN CHAUFFEUR
        // ============================================================
        function showSavedDriver(id) {
            savedDriverEl.style.display = 'flex';
            savedDriverName.textContent = id;
        }

        function clearSavedDriver() {
            localStorage.removeItem(STORAGE_KEY);
            savedDriverEl.style.display = 'none';
            driverIdInput.value = '';
            driverIdInput.disabled = false;
            if (isTracking) {
                stopTracking();
            }
        }

        function loadSavedDriver() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                driverIdInput.value = saved;
                showSavedDriver(saved);
            }
        }

        // ============================================================
        // COMMANDO LISTENER
        // ============================================================
        async function checkCommands() {
            try {
                const { data, error } = await supabaseClient
                    .from(COMMAND_TABLE)
                    .select('*')
                    .eq('driver_id', driverId)
                    .eq('executed', false)
                    .order('created_at', { ascending: true })
                    .limit(1);

                if (error) {
                    console.warn('⚠️ Commando check error:', error.message);
                    return;
                }

                if (data && data.length > 0) {
                    const command = data[0];
                    console.log(`📩 Commando ontvangen voor ${driverId}:`, command.command);

                    if (command.command === 'start') {
                        startTracking();
                    } else if (command.command === 'stop') {
                        stopTracking();
                    }

                    await supabaseClient
                        .from(COMMAND_TABLE)
                        .update({ executed: true })
                        .eq('id', command.id);
                }
            } catch (err) {
                console.warn('⚠️ Commando check exception:', err.message);
            }
        }

        // ============================================================
        // PAGE VISIBILITY
        // ============================================================
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                console.log('📱 Tabblad weer zichtbaar');
                if (!isTracking && driverId) {
                    console.log('🔄 Tracker herstarten...');
                    startTracking();
                }
            }
        });

        // ============================================================
        // NETWERK STATUS
        // ============================================================
        window.addEventListener('online', function() {
            console.log('🌐 Internet verbinding hersteld');
            if (!isTracking && driverId) {
                console.log('🔄 Tracker herstarten na verbinding...');
                startTracking();
            }
        });

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        startBtn.addEventListener('click', startTracking);
        stopBtn.addEventListener('click', stopTracking);
        clearSavedDriverBtn.addEventListener('click', clearSavedDriver);

        driverIdInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                startTracking();
            }
        });

        // ============================================================
        // START
        // ============================================================
        console.log('✅ Tracker geladen (flexibele ID)');

        // Laad opgeslagen chauffeur
        loadSavedDriver();

        // Start automatisch als er een opgeslagen ID is
        if (localStorage.getItem(STORAGE_KEY)) {
            setTimeout(() => {
                startTracking();
            }, 1000);
        }

        // Commando listener (alleen als er een driver ID is)
        setInterval(() => {
            if (driverId) {
                checkCommands();
            }
        }, 5000);

        window.addEventListener('beforeunload', function() {
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            if (intervalId) clearInterval(intervalId);
        });
    </script>
</body>
</html>
